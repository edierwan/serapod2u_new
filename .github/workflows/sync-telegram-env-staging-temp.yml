name: Sync Telegram env to Coolify staging (temp)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert TELEGRAM_* on Coolify staging app
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}"
          uuid="${APP_UUID:-ao0gw084g0skgoo0ko4wwsco}"
          auth=(-H "Authorization: Bearer ${COOLIFY_API_TOKEN}" -H "Accept: application/json" -H "Content-Type: application/json")

          upsert() {
            local key="$1" value="$2"
            echo "Upserting $key"
            # Coolify v4: POST /api/v1/applications/{uuid}/envs
            code=$(curl -sS -o /tmp/env-out.json -w "%{http_code}" \
              "${auth[@]}" \
              -X POST \
              "${base}/api/v1/applications/${uuid}/envs" \
              -d "{\"key\":\"${key}\",\"value\":\"${value}\",\"is_preview\":false,\"is_literal\":true,\"is_shown_once\":false,\"is_executable\":false}" || true)
            echo "HTTP $code"
            cat /tmp/env-out.json || true
            echo
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              # fallback bulk endpoint used by some Coolify versions
              code2=$(curl -sS -o /tmp/env-bulk.json -w "%{http_code}" \
                "${auth[@]}" \
                -X PATCH \
                "${base}/api/v1/applications/${uuid}/envs/bulk" \
                -d "[{\"key\":\"${key}\",\"value\":\"${value}\"}]" || true)
              echo "bulk HTTP $code2"
              cat /tmp/env-bulk.json || true
              echo
            fi
          }

          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_BOT_USERNAME:-}"
          test -n "${TELEGRAM_WEBHOOK_SECRET:-}"

          upsert TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          upsert TELEGRAM_BOT_USERNAME "$TELEGRAM_BOT_USERNAME"
          upsert TELEGRAM_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"
          echo "done"
