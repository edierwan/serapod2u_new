name: Recover Staging Runtime (one-time)

on:
  push:
    branches: [codex/recover-staging-runtime]

jobs:
  trigger-coolify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger one staging deployment from the prebuilt image
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COOLIFY_URL}"
          test -n "${COOLIFY_UUID}"
          test -n "${COOLIFY_TOKEN}"
          curl --fail-with-body -sS -X GET \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=true" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
