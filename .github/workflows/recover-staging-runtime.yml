name: Start Staging Runtime (one-time)

on:
  push:
    branches: [codex/recover-staging-runtime]

jobs:
  start-coolify:
    runs-on: macos-latest
    steps:
      - name: Start the staging application immediately
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COOLIFY_URL}"
          test -n "${COOLIFY_UUID}"
          test -n "${COOLIFY_TOKEN}"
          curl --fail-with-body -sS -4 --connect-timeout 20 --max-time 45 -X GET \
            "${COOLIFY_URL%/}/api/v1/applications/${COOLIFY_UUID}/start?instant_deploy=true" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
