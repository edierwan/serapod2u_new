name: List Coolify apps (temp)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/list-coolify-apps.yml'

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List Coolify applications
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}"
          echo "Coolify base: $base"
          code=$(curl -sS -o /tmp/coolify-apps.json -w "%{http_code}" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            "${base}/api/v1/applications" || true)
          echo "HTTP $code"
          python3 <<'PY'
          import json
          raw=open('/tmp/coolify-apps.json','r',encoding='utf-8').read()
          print(raw[:500])
          data=json.loads(raw)
          apps=data if isinstance(data,list) else data.get('data', data)
          if not isinstance(apps, list):
              print('unexpected', type(apps))
              raise SystemExit(0)
          for a in apps:
              if not isinstance(a, dict):
                  continue
              uuid=a.get('uuid') or a.get('id')
              name=a.get('name') or ''
              fqdn=a.get('fqdn') or a.get('domains') or ''
              git=a.get('git_branch') or a.get('branch') or ''
              print(f"{uuid}\tbranch={git}\tname={name}\tfqdn={fqdn}")
          PY
